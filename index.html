<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evuro</title>
    <style>
        /* Reset and basic styles */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 400px;
            background: #f9f9fb;
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 12px 30px rgb(72 82 196 / 0.15);
            text-align: center;
        }

        /* Buttons */
        button {
            background: linear-gradient(135deg, #5865f2, #4752c4);
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 15px 30px;
            margin: 12px 0;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(72, 82, 196, 0.3);
            transition: background 0.3s ease, transform 0.2s ease;
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            background: linear-gradient(135deg, #4752c4, #5865f2);
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Evuro</h2>
        <button id="inviteDiscordBtn" type="button" aria-label="Invite to Discord">Invite to Discord</button>
        <button id="joinDiscordBtn" type="button" aria-label="Join Discord">Join Discord</button>
    </div>

    <script>
        // URLs for Discord buttons
        const joinDiscordURL = "https://discord.gg/5KpaAVDHN6"; // Replace with your actual invite link
        const inviteDiscordURL = "https://discord.com/oauth2/authorize?client_id=1368281135272038420&permissions=8&integration_type=0&scope=bot"; // Replace with your bot invite URL

        // Elements
        const inviteDiscordBtn = document.getElementById('inviteDiscordBtn');
        const joinDiscordBtn = document.getElementById('joinDiscordBtn');

        // Event listeners for buttons
        inviteDiscordBtn.addEventListener('click', () => {
            window.open(inviteDiscordURL, '_blank');
        });

        joinDiscordBtn.addEventListener('click', () => {
            window.open(joinDiscordURL, '_blank');
        });
    </script>
</body>

</html>
